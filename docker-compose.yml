services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kivi-postgres
    environment:
      POSTGRES_USER: kivi
      POSTGRES_PASSWORD: kivi_dev
      POSTGRES_DB: kivi_memory
    ports:
      - "5432:5432"
    volumes:
      - kivi_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kivi-redis
    ports:
      - "6379:6379"

volumes:
  kivi_postgres_data:
